<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Iframe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>

<body>

    <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSemmsYo7pVHgVS3G6KdU9k2QH8XPVWoxMopY0Tz4kp5HvvEMg/viewform?usp=sharing&ouid=100732334189295793300"
        title="Full Screen Website">
    </iframe>

</body>
</html>
